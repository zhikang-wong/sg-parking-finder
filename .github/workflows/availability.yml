name: Refresh carpark availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LTA DataMall availability
        env:
          DATAMALL_KEY: ${{ secrets.DATAMALL_KEY }}
        run: python3 scripts/fetch_datamall.py availability.json

      - name: Publish to availability branch
        run: |
          git config user.name "availability-bot"
          git config user.email "actions@github.com"
          git checkout --orphan availability-new
          git rm -rf --cached . > /dev/null
          git add -f availability.json
          git commit -q -m "availability $(date -u +%FT%TZ)"
          git push -f origin availability-new:availability
